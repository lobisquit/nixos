# Alerts with `severity: critical` are sent by email too (see the
# Alertmanager routes in monitoring.nix): use it for the problems that
# may lose data or break the XMPP notifications themselves.
groups:
  - name: monitoring
    rules:
      - alert: monitoring:down
        expr: up == 0
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.job }}] monitoring target {{ $labels.instance }} is down"
          description: "Instance {{ $labels.instance }} of {{ $labels.job }} does not answer to Prometheus"

      # Alertmanager could not deliver a notification over XMPP (bot down,
      # nasus unreachable, wrong password, ...). Routed by email only.
      - alert: alertmanager:xmpp_failing
        expr: increase(alertmanager_notifications_failed_total{integration="webhook"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.job }}] Alertmanager cannot send notifications over XMPP"
          description: |
            Some notifications were not delivered to prometheus-xmpp-alerts
            in the last 15 minutes: check the other alerts in Alertmanager.

  - name: resources
    rules:
      # disk usage
      - record: resources:disk_usage
        expr: 1 - node_filesystem_avail_bytes / node_filesystem_size_bytes

      - alert: resources:high_disk_usage_root
        expr: resources:disk_usage{mountpoint="/"} > 0.8
        labels:
          severity: critical
        annotations:
          summary: "[{{ $labels.job }}] {{ $labels.mountpoint }} is almost full"
          description: |
            In {{ $labels.job }}, disk {{ $labels.device }} mounted on
            {{ $labels.mountpoint }} is more than 80% occupied

      # ram usage
      - record: resources:ram_usage
        expr: |
          1 - (node_memory_MemFree_bytes +
               node_memory_Cached_bytes +
               node_memory_Buffers_bytes) / node_memory_MemTotal_bytes

      - alert: resources:high_ram_usage
        expr: resources:ram_usage > 0.8
        for: 5m
        annotations:
          summary: "[{{ $labels.job }}] RAM is almost full"

      # swap usage
      - record: resources:swap_usage
        expr: 1 - (node_memory_SwapFree_bytes + node_memory_SwapCached_bytes) / node_memory_SwapTotal_bytes

      - alert: resources:high_swap_usage
        expr: resources:swap_usage > 0.3
        for: 5m
        annotations:
          summary: "[{{ $labels.job }}] too much swap is in use"

      # cpu usage
      - record: resources:cpu_usage
        expr: 1 - rate(node_cpu_seconds_total{mode="idle"}[1m])

      # network rate (uplink, downlink)
      - record: resources:network_receive_rate
        expr: rate(node_network_receive_bytes_total[30s])

      - record: resources:network_transmit_rate
        expr: rate(node_network_transmit_bytes_total[30s])

  - name: systemd
    interval: 3s

    rules:
      - record: systemd:list
        expr: node_systemd_unit_state

      # services that must be active
      - record: systemd:is_active
        expr: systemd:list{state="active"}

      - alert: systemd:bacero:nginx:not_active
        expr: |
          absent(systemd:is_active{job="bacero", name="nginx.service"}) or
          systemd:is_active{job="bacero", name="nginx.service"} == 0
        annotations:
          summary: "[{{ $labels.job }}] nginx is down"

      - alert: systemd:bacero:sshd:not_active
        expr: |
          absent(systemd:is_active{job="bacero", name="sshd.service"}) or
          systemd:is_active{job="bacero", name="sshd.service"} == 0
        annotations:
          summary: "[{{ $labels.job }}] SSH daemon is not running"

      - alert: systemd:bacero:doorman:not_active
        expr: |
          absent(systemd:is_active{job="bacero", name="doorman.service"}) or
          systemd:is_active{job="bacero", name="doorman.service"} == 0
        for: 10m
        annotations:
          summary: "[{{ $labels.job }}] doorman is down"

      - alert: systemd:bacero:xmpp_alerts:not_active
        expr: |
          absent(systemd:is_active{job="bacero", name="prometheus-xmpp-alerts.service"}) or
          systemd:is_active{job="bacero", name="prometheus-xmpp-alerts.service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "[bacero] XMPP alerts bot is not running"

      # services that fail
      - record: systemd:is_failed
        expr: systemd:list{state="failed"}

      - alert: systemd:any:failed
        expr: systemd:is_failed == 1
        annotations:
          summary: "[{{ $labels.job }}] SystemD unit {{ $labels.name }} has failed"
